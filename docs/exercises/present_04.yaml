exercise:
  id: "present_04"
  module: "Teraźniejszość"
  title: "Moje Schematy Myślenia"
  difficulty: 3
  estimated_time: "25-35 minut"
  psychological_basis: "Terapia poznawczo-behawioralna (CBT), zniekształcenia poznawcze (Beck, 1979) + Terapia Akceptacji i Zaangażowania (ACT, Hayes et al.)"
  content_warning: >
    Rozpoznawanie własnych schematów myślenia może być konfrontujące.
    Pamiętaj: te schematy nie świadczą o Twojej „wadliwości”, to nawyki
    umysłu, które kiedyś mogły Ci służyć. Podejdź do siebie z ciekawością,
    nie z krytyką.

  contraindications: |
    To ćwiczenie nie jest zalecane, jeśli:
    - Aktualnie przeżywasz ostry kryzys psychiczny lub masz myśli samobójcze
    - Jesteś we wczesnej fazie terapii traumy (PTSD, CPTSD), skonsultuj
      z terapeutą
    - Twoje główne przeszkody są związane z aktywną traumą, która nie została
      jeszcze przepracowana w bezpiecznym otoczeniu terapeutycznym
    W każdym z tych przypadków zachęcamy do pracy z profesjonalistą.

  introduction: |
    Aaron Beck, twórca terapii poznawczo-behawioralnej, odkrył coś, co wydaje się oczywiste,
    ale zmienia wszystko: nasz umysł nie rejestruje rzeczywistości obiektywnie. Filtruje ją,
    zniekształca, upraszcza i robi to w sposób nawykowy, poza naszą świadomością. Te nawykowe
    filtry nazywamy zniekształceniami poznawczymi (ang. cognitive distortions).

    Ważne zastrzeżenie: to nie jest o „byciu w błędzie”. Te schematy nie są defektami, to
    skróty myślowe, które umysł wykształcił, często w odpowiedzi na trudne doświadczenia.
    Dziecko, które słyszało ciągłą krytykę, może nauczyć się myślenia czarno-białego jako
    sposobu na przewidzenie, kiedy będzie bezpiecznie. Osoba, która doświadczyła straty,
    może rozwinąć katastrofizowanie jako próbę „przygotowania się na najgorsze”. Te schematy
    kiedyś służyły jakiemuś celowi. Pytanie brzmi: czy nadal Ci służą?

    Poniżej znajdziesz listę najczęstszych zniekształceń poznawczych z przykładami po polsku.
    Przeczytaj ją uważnie, nie po to, żeby „naprawić” swoje myślenie, ale żeby je zobaczyć.

    **Najczęstsze zniekształcenia poznawcze:**

    1. **Katastrofizowanie** - wyobrażanie sobie najgorszego możliwego scenariusza.
       Przykład: „Szef chce ze mną porozmawiać, na pewno mnie zwolni.”

    2. **Myślenie czarno-białe (polaryzacja)** - widzenie sytuacji tylko w skrajnościach.
       Przykład: „Albo zrobię to idealnie, albo nie ma sensu próbować.”

    3. **Nadmierne uogólnianie** - wyciąganie szerokich wniosków z jednego zdarzenia.
       Przykład: „Nie dostałem tej pracy, nigdy niczego nie osiągnę.”

    4. **Czytanie w myślach** - zakładanie, że wiesz, co inni myślą.
       Przykład: „Na pewno myślą, że jestem nudna.”

    5. **Filtr negatywny** - skupianie się wyłącznie na negatywach, ignorowanie pozytywów.
       Przykład: „Prezentacja poszła dobrze, ale zapomniałam jednego slajdu, to była katastrofa.”

    6. **Powinności (tyrania „powinno się”)** - sztywne reguły narzucane sobie i innym.
       Przykład: „Powinienem radzić sobie sam. Proszenie o pomoc to słabość.”

    7. **Personalizacja** - branie na siebie odpowiedzialności za rzeczy poza kontrolą.
       Przykład: „Mama jest smutna, to pewnie przeze mnie.”

    8. **Etykietowanie** - zastępowanie opisu zachowania globalną oceną osoby.
       Przykład: „Nie jestem osobą, która zapomniała, jestem nieodpowiedzialny.”

    9. **Dyskwalifikacja pozytywów** - umniejszanie dobrych doświadczeń.
       Przykład: „Zdałam egzamin, ale to tylko dlatego, że był łatwy.”

    10. **Wróżenie z przyszłości** - przekonanie, że wiesz, jak coś się skończy.
        Przykład: „Nie ma sensu wysyłać CV, i tak mnie nie wezmą.”

  prompt_questions:
    - “Przeczytaj powyższą listę zniekształceń. Które z nich rozpoznajesz u siebie? Wybierz 2-4, które pojawiają się najczęściej. Nie musisz wybierać tych „najgorszych”, wybierz te, które najczęściej wpływają na Twoje codzienne myślenie.”
    - "Dla każdego wybranego zniekształcenia opisz konkretną sytuację, w której się pojawia. Co się dzieje? Jaka myśl pojawia się automatycznie? Jak ta myśl wpływa na to, co czujesz i co robisz (lub czego nie robisz)?"
    - "Spróbuj zastanowić się: kiedy ten schemat mógł się pojawić w Twoim życiu? Czy przypominasz sobie sytuację z przeszłości, w której taki sposób myślenia miał sens, chronił, pomagał przetrwać, dawał poczucie kontroli? Nie musisz mieć pewności, wystarczy intuicja. Jeśli to pytanie przywołuje bardzo trudne wspomnienia, możesz je pominąć i przejść do następnego. To ćwiczenie nie wymaga powrotu do bolesnej przeszłości."
    - “Gdybyś miał opisać swoje myślenie jednym wzorcem, jakie zdanie najczęściej pojawia się w głowie? Może to „Nie dam rady”, może „Muszę być idealny”, może „Inni mają łatwiej”. Zapisz to zdanie i zobacz, jak reaguje Twoje ciało, gdy je czytasz.”

  stuck_helpers:
    - “Jeśli żadne zniekształcenie nie wydaje się „Twoje\”, spróbuj pomyśleć o ostatniej sytuacji, która Cię zdenerwowała. Jaka pierwsza myśl pojawiła się automatycznie? Porównaj ją z listą.”
    - “Możesz też zapytać kogoś bliskiego: „Jakie zdanie słyszysz ode mnie najczęściej, gdy się denerwuję?”. Czasem inni widzą nasze wzorce lepiej niż my sami.”
    - “Nie musisz dokładnie dopasować swojego doświadczenia do kategorii z listy. Zniekształcenia się przenikają i mieszają. Jeśli rozpoznajesz „coś podobnego\”, to wystarczy.”
    - "Pamiętaj, że celem nie jest wyeliminowanie tych myśli. Celem jest zobaczenie ich, jak zauważasz wzór na tapecie, który wcześniej był niewidoczny, bo był wszędzie. Samo zobaczenie to już zmiana."

  reflection_prompt: |
    Patrząc na swoje odpowiedzi, czy widzisz „główny schemat”, który organizuje
    Twoje myślenie? Gdybyś miał nadać mu imię lub tytuł (np. „Wewnętrzny Perfekcjonista”,
    „Strażnik Najgorszego Scenariusza”), jak by się nazywał? Czasem nadanie imienia
    schematowi pomaga oddzielić go od siebie. To nie jest „ja\”, to mój nawyk myślowy.

  post_exercise_note: |
    Jeśli po tym ćwiczeniu czujesz się gorzej niż przed, to normalna
    reakcja. Badania nad pisaniem ekspresywnym pokazują, że po ćwiczeniach
    tego typu można poczuć się chwilowo gorzej. To normalna część procesu,
    która zwykle mija w ciągu 1-2 dni. Daj sobie czas.

  why_it_works: |
    Terapia poznawczo-behawioralna Becka jest jednym z najlepiej przebadanych podejść
    terapeutycznych. Samo rozpoznanie zniekształceń poznawczych, bez próby ich natychmiastowej
    zmiany, zwiększa metapoznanie (myślenie o myśleniu) i zmniejsza automatyczność reakcji
    emocjonalnych (Beck, 2011). W połączeniu z perspektywą ACT, która nie wymaga walki z myślami,
    ale ich zauważania, tworzy się przestrzeń między bodźcem a reakcją, przestrzeń, w której
    zaczyna się wolność wyboru.
