exercise:
  id: "past_01"
  module: "Przeszłość"
  title: "Mapa Twojego Życia"
  difficulty: 1
  estimated_time: "20-30 minut"
  psychological_basis: "Tożsamość narracyjna (McAdams, 2001)"
  content_warning: null

  introduction: |
    Każdy z nas nosi w sobie historię. Nie zawsze ją opowiadamy, czasem po prostu z nią żyjemy,
    nie zastanawiając się nad jej kształtem. To ćwiczenie to pierwszy krok: spojrzenie na swoje
    życie z lotu ptaka, bez oceniania, bez analizowania. Tylko zobaczenie.

    Badania Dana McAdamsa nad tożsamością narracyjną pokazują, że ludzie, którzy potrafią
    ułożyć swoje doświadczenia w spójną opowieść, lepiej rozumieją siebie i łatwiej radzą
    sobie z trudnościami. Ale żeby ułożyć opowieść, trzeba najpierw zobaczyć jej elementy.

    W tym ćwiczeniu stworzysz prostą mapę swojego życia, listę 7-10 kluczowych momentów,
    ułożonych w czasie. Nie musisz o nich pisać, wystarczy, że je nazwiesz i umiejscowisz.
    To może być przeprowadzka, narodziny rodzeństwa, pierwszy dzień w nowej szkole, wakacje
    z dziadkami, utrata kogoś bliskiego, ale też chwila ciszy, w której coś do Ciebie dotarło.

    Nie szukaj tylko dramatycznych wydarzeń. Często to ciche momenty, rozmowa, książka
    czy spacer, kształtują nas najbardziej. Zaufaj temu, co przychodzi Ci do głowy jako pierwsze.

  prompt_questions:
    - "Wypisz 7-10 momentów z Twojego życia, które wydają Ci się ważne. Przy każdym zapisz orientacyjny czas (rok lub okres życia) i krótką nazwę, jedno zdanie lub kilka słów."
    - "Czy widzisz momenty, które Cię zaskakują? Coś, o czym dawno nie myślałeś, a co samo przyszło na myśl?"
    - "Czy są okresy w Twoim życiu, z których nic nie przychodzi Ci do głowy? To też jest informacja. Zapisz to."
    - "Gdybyś miał wybrać 3 momenty, które najbardziej uczyniły Cię osobą, którą jesteś dzisiaj, które by to były?"

  stuck_helpers:
    - "Jeśli patrzenie na całe życie przytłacza, zacznij od ostatnich 5 lat. To wystarczy. Możesz wrócić do wcześniejszych lat później albo wcale."
    - "Spróbuj pomyśleć o miejscach, w których żyłeś. Każda przeprowadzka, każda zmiana otoczenia często wiąże się z ważnym momentem."
    - "Możesz też pomyśleć o ludziach: kto pojawił się w Twoim życiu, a kto z niego zniknął? To często wyznacza ważne punkty na mapie."
    - "Nie ma złych odpowiedzi. Jeśli przychodzi Ci do głowy moment, który wydaje się 'zbyt mały' lub 'nieistotny', zapisz go. Skoro przyszedł na myśl, jest ważny."

  reflection_prompt: |
    Spójrz na to, co zapisałeś. Nie analizuj jeszcze, po prostu zobacz.
    Jak się czujesz, patrząc na te momenty zebrane w jednym miejscu?
    Czy coś Cię zaskakuje w tym, co {{wybral}}?

  why_it_works: |
    Tworzenie mapy życia angażuje mechanizm tożsamości narracyjnej, czyli zdolność do widzenia
    swojego życia jako spójnej historii, a nie chaotycznego ciągu wydarzeń. Badania McAdamsa
    (2001) pokazują, że sam akt nazywania i porządkowania doświadczeń w czasie pomaga
    odzyskać poczucie ciągłości i sprawczości. To ćwiczenie nie wymaga jeszcze głębokiej
    refleksji. Jest bezpiecznym punktem wyjścia, który daje fundament dla dalszej pracy.
