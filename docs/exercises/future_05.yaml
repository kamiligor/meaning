exercise:
  id: "future_05"
  module: "Przyszłość"
  title: "List do Przyszłego Siebie"
  difficulty: 3
  estimated_time: "20-35 minut"
  psychological_basis: "Ciągłość przyszłego Ja (Hershfield, 2011) + Tożsamość narracyjna (McAdams, 2001)"
  content_warning: |
    To ćwiczenie może wywołać silne emocje, będziesz pisać do przyszłej
    wersji siebie, co wymaga refleksji nad całą dotychczasową drogą
    w programie. Jeśli poczujesz, że to za dużo, możesz przerwać
    i wrócić później.
  contraindications: |
    Jeśli trudno wyobrazić sobie, że masz przyszłość, jeśli ta myśl
    budzi lęk lub pustkę, to ćwiczenie może nie być odpowiednie
    w tym momencie. Brak zdolności do wyobrażenia sobie przyszłości może być
    sygnałem, że warto porozmawiać ze specjalistą. To nie jest słabość,
    to ważna informacja o tym, czego teraz potrzebujesz.
    Telefon Zaufania: 116 123.

  introduction: |
    W Module I być może pisałeś do przeszłego siebie, do osoby, która przeżyła trudne
    rzeczy i zasługiwała na ciepło i zrozumienie. Teraz odwracamy kierunek. Tym razem
    piszesz do osoby, która jeszcze nie istnieje, ale która powstanie z Twoich
    dzisiejszych wyborów.

    Hal Hershfield w swoich badaniach nad ciągłością przyszłego Ja odkrył, że ludzie,
    którzy czują silniejszy emocjonalny związek ze swoim przyszłym sobą, podejmują
    mądrzejsze decyzje, oszczędzają więcej, lepiej dbają o zdrowie, rzadziej odkładają
    ważne rzeczy. Pisanie listu do przyszłego siebie jest jednym z najprostszych sposobów
    na zbudowanie tego związku. Kiedy piszesz do kogoś, nawet do siebie z przyszłości,
    zaczynasz traktować tę osobę jako realną, jako kogoś, na kim Ci zależy.

    Dan McAdams pisze o tożsamości narracyjnej, o tym, że jesteśmy opowieściami, które
    sobie o sobie opowiadamy. Ten list to moment, w którym świadomie dodajesz nowy
    rozdział do swojej historii. Nie przepisując przeszłości, nie udając, że wszystko
    jest dobrze, ale mówiąc przyszłemu sobie: „Wiem, skąd idziemy. Wiem, czego się
    nauczyliśmy. Oto co mam nadzieję, że pamiętasz."

    Pisz do przyszłego Ja tak, jak do przeszłego w Module I, z ciepłem i uczciwością.
    Nie z presją bycia lepszym. Z szacunkiem dla drogi, która przed Tobą.

  prompt_questions:
    - "Zacznij list: 'Drogi Ja za rok...' (lub za dwa lata, jeśli wolisz). Napisz, co teraz czujesz, w tym momencie, na tym etapie programu. Co się zmieniło w Twoim myśleniu od początku? Co teraz rozumiesz o sobie, czego wcześniej nie było widać?"
    - "Napisz, czego się nauczyłeś: z Modułu o przeszłości, z refleksji nad teraźniejszością, z wizji przyszłości. Nie chodzi o wielkie rewelacje. Może to jedno zdanie, które utkwiło. Może to jedno ćwiczenie, które Cię poruszyło. Podziel się tym z przyszłym sobą."
    - "Napisz, co masz nadzieję, że przyszłe Ty zrobiło, ale bez rozkazów i oczekiwań. Nie 'Mam nadzieję, że schudłeś 10 kilo.' Raczej: 'Mam nadzieję, że nadal słuchasz siebie. Mam nadzieję, że nie zrezygnowałeś z tego, co jest dla Ciebie ważne.' Pisz z troską, nie z presją."
    - "Na koniec napisz, co chcesz, żeby przyszłe Ty pamiętało, nawet jeśli zapomni wszystko inne z tego programu. Jedno zdanie, jedna myśl, jedno przesłanie. Co jest najważniejsze?"

  stuck_helpers:
    - "Jeśli nie wiesz, jak zacząć, wyobraź sobie, że piszesz do bliskiego przyjaciela, który wyrusza w długą podróż. Co byś powiedział na pożegnanie? A teraz skieruj te słowa do siebie."
    - "Możesz zacząć od czegoś prostego: 'Nie wiem, co pisać, ale chcę, żebyś wiedział, że...' i zobaczyć, co się pojawi. Pierwsze zdanie nie musi być dobre. Ma być pierwsze."
    - "Jeśli czujesz, że to ćwiczenie jest sztuczne, to normalne. Pisanie do osoby, która jeszcze nie istnieje, jest dziwne. Ale każdy list staje się prawdziwy w momencie, kiedy go piszesz. Daj sobie te 10 minut sztuczności, często zamienia się w coś niespodziewanie szczerego."
    - "Spróbuj napisać to, co {{sam}} chciałbyś usłyszeć za rok. Jakich słów byś potrzebował? Jakie przesłanie pomogłoby w trudnym momencie? Napisz to teraz, dla siebie z przyszłości."

  reflection_prompt: |
    Przeczytaj swój list. Jakie emocje się pojawiają, kiedy czytasz te słowa?
    Czy przyszłe Ty to ktoś, kogo lubisz? Ktoś, komu kibicujesz?
    Czy traktujesz tę osobę z taką samą troską, z jaką {{napisal}}
    do przeszłego siebie? Jeśli nie, co by się zmieniło, gdyby spróbować?
    Możesz dopisać zdanie lub dwa, jeśli chcesz.

  why_it_works: |
    Pisanie listu do przyszłego siebie łączy dwa potężne mechanizmy psychologiczne.
    Ciągłość przyszłego Ja (Hershfield): akt pisania zmusza mózg do traktowania przyszłego
    siebie jako realnej osoby z emocjami, potrzebami i historią, a nie jako abstrakcyjnego
    konceptu. To zmniejsza „dyskont temporalny\", czyli tendencję do ignorowania przyszłych
    konsekwencji na rzecz natychmiastowej wygody. Tożsamość narracyjna (McAdams): list
    tworzy świadomy most między teraźniejszością a przyszłością, wpisując obecne doświadczenia
    i nadzieje w spójną opowieść o sobie. Badania pokazują, że ludzie, którzy potrafią opowiadać
    swoje życie jako ciągłą historię, z przeszłością, teraźniejszością i przyszłością,
    mają silniejsze poczucie tożsamości i większą odporność psychiczną.
