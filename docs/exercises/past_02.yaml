exercise:
  id: "past_02"
  module: "Przeszłość"
  title: "Rozdziały Mojego Życia"
  difficulty: 2
  estimated_time: "30-45 minut"
  psychological_basis: "Tożsamość narracyjna (McAdams, 2001) + Ruminacja vs refleksja (Trapnell & Campbell, 1999)"
  content_warning: null

  disclaimer: |
    Ten program nie zastępuje psychoterapii ani innej formy profesjonalnej
    pomocy psychologicznej. Jeśli czujesz, że potrzebujesz wsparcia,
    zachęcamy do kontaktu ze specjalistą.
    Telefon Zaufania dla Dorosłych: 116 123
    Centrum Wsparcia: 800 70 2222

  introduction: |
    W poprzednim ćwiczeniu stworzyłaś/eś mapę — listę ważnych momentów. Teraz zrobimy
    następny krok: podzielisz swoje życie na rozdziały, tak jakby było książką.

    Czemu akurat rozdziały? Badania nad tożsamością narracyjną pokazują, że ludzie
    naturalnie myślą o swoim życiu w kategoriach okresów — „kiedy byłem dzieckiem",
    „po przeprowadzce", „zanim się rozstaliśmy". Nadanie tym okresom nazw i granic
    pomaga przejść od chaotycznego wspominania do świadomej refleksji. To ważne
    rozróżnienie: ruminacja to kółko bez wyjścia, refleksja to patrzenie z pewnym dystansem
    i ciekawością. W tym ćwiczeniu ćwiczymy refleksję.

    Podziel swoje życie na 5-7 rozdziałów. Każdy rozdział ma swój tytuł — tak jak
    rozdziały w powieści. Tytuł może być poetycki, zabawny, prosty lub metaforyczny.
    To Twoja książka. Potem napisz 3-5 zdań o każdym rozdziale: co go definiowało,
    jaki miałeś/aś wtedy nastrój, co było ważne.

    Nie ma jednego „poprawnego" sposobu dzielenia życia. Możesz dzielić według miejsc,
    relacji, stanów emocjonalnych, szkół, pracy — czegokolwiek, co ma dla Ciebie sens.

  prompt_questions:
    - "Podziel swoje życie na 5-7 rozdziałów. Nadaj każdemu tytuł — może być prosty ('Szkoła podstawowa'), metaforyczny ('Cisza przed burzą') lub osobisty. Przy każdym zapisz orientacyjne lata."
    - "Dla każdego rozdziału napisz 3-5 zdań: co definiowało ten okres? Jaki miałeś/aś nastrój? Co było w centrum Twojego życia?"
    - "Czy widzisz momenty przejścia między rozdziałami? Co powodowało, że jeden rozdział się kończył, a zaczynał się następny?"
    - "Gdybyś miał/a dać podtytuł całej książce swojego życia — dotychczasowej — jak by brzmiał?"

  stuck_helpers:
    - "Jeśli trudno Ci podzielić życie na rozdziały, zacznij od oczywistych granic: szkoła, przeprowadzka, zmiana pracy, początek lub koniec związku. Potem możesz doprecyzować."
    - "Nie musisz zaczynać od narodzin. Możesz zacząć od najwcześniejszego wspomnienia lub od momentu, który uznasz za początek 'świadomego życia'."
    - "Jeśli 5-7 rozdziałów wydaje się za dużo, zacznij od trzech: początek, środek, teraz. Potem sprawdź, czy którykolwiek chciałbyś podzielić na mniejsze części."
    - "Tytuły rozdziałów nie muszą być mądrze ani głęboko. 'Rok, w którym dużo płakałam' albo 'Pizza i internet' są równie dobre co 'Transformacja'. Chodzi o to, żeby tytuł mówił Ci coś o tym okresie."

  reflection_prompt: |
    Przeczytaj swoje rozdziały od początku do końca. Zauważ, jak Twoje życie
    wygląda, gdy jest podzielone w ten sposób. Czy widzisz jakiś wzorzec — coś,
    co się powtarza? Motywy, które wracają? A może coś, co Cię zaskakuje
    w sposobie, w jaki podzieliłeś/aś swoją historię?

  why_it_works: |
    Dzielenie życia na rozdziały to technika z terapii narracyjnej, wspierana badaniami
    McAdamsa nad tożsamością narracyjną. Nadawanie struktury doświadczeniom przenosi
    wspominanie z trybu ruminacyjnego (powtarzanie tych samych myśli w kółko) do trybu
    refleksyjnego (obserwowanie z ciekawością i dystansem). Trapnell i Campbell (1999)
    wykazali, że ta różnica ma kluczowe znaczenie dla zdrowia psychicznego — refleksja
    prowadzi do wglądu, ruminacja do pogorszenia nastroju. Nazywanie i porządkowanie
    okresów życia daje poczucie sprawczości nad własną historią.
